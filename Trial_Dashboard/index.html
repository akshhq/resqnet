<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQNet Live Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast"></div>

<!-- ── Add device modal ── -->
<div id="add-modal">
  <div id="modal-box">
    <h2>Add Simulated Device</h2>
    <div class="modal-field">
      <label>Device Name</label>
      <input id="modal-name" placeholder="e.g. Field Unit 1" />
    </div>
    <div class="modal-field">
      <label>Starting Location</label>
      <select id="modal-location">
        <option value="28.6139,77.2090">New Delhi, India</option>
        <option value="19.0760,72.8777">Mumbai, India</option>
        <option value="12.9716,77.5946">Bengaluru, India</option>
        <option value="22.5726,88.3639">Kolkata, India</option>
        <option value="51.5074,-0.1278">London, UK</option>
        <option value="40.7128,-74.0060">New York, USA</option>
        <option value="custom">Custom coordinates…</option>
      </select>
    </div>
    <div class="modal-field" id="custom-coords-row" style="display:none;">
      <label>Lat, Lng</label>
      <input id="modal-custom" placeholder="28.6139, 77.2090" />
    </div>
    <div class="modal-field">
      <label>Mode</label>
      <select id="modal-mode">
        <option value="walking">Walking</option>
        <option value="stationary">Stationary</option>
        <option value="running">Running</option>
        <option value="vehicle">Vehicle</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="confirmAddDevice()">Add Device</button>
    </div>
  </div>
</div>

<!-- ── Left sidebar ── -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>🛡 ResQNet</h1>
    <span class="version">v0.5 · Simulator</span>
  </div>

  <!-- Device list (top 50%) -->
  <div id="device-section">
    <div class="section-header">
      Devices
      <button id="add-device-btn" onclick="openModal()">+ Add Device</button>
    </div>
    <div id="device-list"></div>
  </div>

  <!-- Movement log (bottom 50%) -->
  <div id="log-section">
    <div class="section-header">
      Movement Log
      <span id="log-device-label">—</span>
    </div>
    <div id="log-list"></div>
  </div>
</div>

<!-- ── Map area ── -->
<div id="map-area">
  <div id="map"></div>

  <!-- HUD top-right -->
  <div id="hud">
    <div class="hud-panel">
      <div id="conn-dot"></div>
      <span id="conn-label">Connecting…</span>
    </div>
    <button id="dark-btn" onclick="toggleTheme()">☀ Light Mode</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
