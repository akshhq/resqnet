# ResQNet — docker-compose.yml
# Place at repo root.
#
# ── Commands ────────────────────────────────────────────────────────────────
#   Start backend + dashboard:
#     docker compose up
#
#   Open dashboard in browser after starting (run in a second terminal):
#     start http://localhost:5500          (Windows)
#     open  http://localhost:5500          (macOS)
#     xdg-open http://localhost:5500       (Linux)
#
#   Simulator — interactive:
#     docker compose --profile sim run --rm simulator
#
#   Simulator — demo mode:
#     docker compose --profile sim run --rm simulator python simulator.py --demo
#
#   Simulator — custom device ID:
#     docker compose --profile sim run --rm simulator python simulator.py --id DEVICE_02
#
#   Rebuild after code changes:
#     docker compose up --build

services:

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5500,http://127.0.0.1:5500
    # Uncomment once backend/.env exists:
    # env_file:
    #   - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/device/HEALTH')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s

  # ── Dashboard ──────────────────────────────────────────────────────────────
  dashboard:
    image: nginx:alpine
    ports:
      - "5500:80"
    volumes:
      - ./Trial_Dashboard:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Simulator ──────────────────────────────────────────────────────────────
  simulator:
    profiles: ["sim"]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "simulator.py", "--url", "http://backend:8000/device/update"]