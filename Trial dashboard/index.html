<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Fix 1.12: without this, mobile browsers render at desktop scale —
       everything appears tiny and the map is unusable on a phone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQNet Live Dashboard</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      font-size: 14px;
    }

    .timeline {
      position: absolute;
      top: 120px;
      left: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111;
      color: #fff;
      padding: 12px 16px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 2000;
      font-size: 14px;
    }

    #toast.show {
      opacity: 1;
    }

    /* Fix 4.1: connection status dot in top-right corner */
    #conn-status {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 7px 12px;
      z-index: 1000;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    #conn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #aaa;
      flex-shrink: 0;
    }

    #conn-dot.connected    { background: #22c55e; }
    #conn-dot.disconnected { background: #ef4444; }
    #conn-dot.reconnecting { background: #f59e0b; }

    /* Fix 4.3: battery bar inside the status box */
    #battery-bar-wrap {
      margin-top: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      height: 8px;
      width: 100%;
      overflow: hidden;
    }

    #battery-bar {
      height: 100%;
      width: 100%;
      background: #22c55e;
      transition: width 0.4s, background 0.4s;
      border-radius: 3px;
    }

    /* Fix 4.6: replay panel below the timeline */
    #replay-panel {
      position: absolute;
      top: 370px;
      left: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      font-size: 13px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #replay-panel input {
      border: 1px solid #d1d5db;
      border-radius: 3px;
      padding: 4px 7px;
      font-size: 13px;
      width: 130px;
    }

    #replay-panel button {
      padding: 4px 10px;
      font-size: 13px;
      border: none;
      border-radius: 3px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    #replay-panel button:hover { background: #2563eb; }
  </style>
</head>

<body>

  <!-- FIX #1: toast div is now correctly inside <body> -->
  <div id="toast"></div>

  <!-- Fix 4.1: persistent connection status dot — top-right corner -->
  <div id="conn-status">
    <div id="conn-dot"></div>
    <span id="conn-label">Connecting…</span>
  </div>

  <!-- Status box — each field is a named span so JS never uses innerHTML -->
  <div class="status" id="status">
    <b>Device:</b> <span id="s-device">—</span><br/>
    <b>Context:</b> <span id="s-context">—</span><br/>
    <b>Risk:</b> <span id="s-risk">—</span><br/>
    <b>Emergency:</b> <span id="s-emergency">—</span>
    <div id="s-esc-row"  style="display:none;"><b>Escalation:</b> <span id="s-escalation"></span></div>
    <div id="s-reset-row" style="display:none;color:#16a34a;">✅ Reset</div>
    <!-- Fix 4.3: battery bar lives here — never wiped because we use spans above -->
    <div id="battery-bar-wrap" style="display:none;margin-top:6px;">
      <div id="battery-bar"></div>
    </div>
    <div id="battery-text" style="font-size:12px;margin-top:3px;display:none;"></div>
  </div>

  <!-- Timeline -->
  <div class="timeline">
    <b>Timeline</b>
    <ul id="timeline"></ul>
  </div>

  <!-- Fix 4.6: replay panel — lets operator trigger history playback from the UI -->
  <div id="replay-panel">
    <b>Replay:</b>
    <input id="replay-id" placeholder="Device ID" />
    <button onclick="replay(document.getElementById('replay-id').value)">▶ Play</button>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Dashboard logic -->
  <script src="script.js"></script>

</body>
</html>
